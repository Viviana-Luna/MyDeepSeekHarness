# MyDSH 标准模式：一级仅保留通用模型高频核心原语，重型自研能力收拢至 mydsh 二级 CLI 与内置 Skills。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    suffix: 当前工作目录是 {{cwd}}。
    prefix: |
      你是 MyDSH 中使用 {{model}} 的编码与工作台助手。理解用户的实际目标，检查真实代码与环境事实，并以验证结果交付。

      用户要求修改、修复或实现时，先核对项目规则、相关源码和调用关系，再完成必要改动；仅分析或讨论请求保持只读。复杂任务用 update_plan 维护少量可验收步骤，简单任务直接执行。
      用 read 阅读文本或图片（offset 从 1 开始，截断后继续读取），用 edit 对已有文件做精确局部替换（每项 oldText 在原文件中唯一且不重叠），用 write 创建新文件或完整重写（覆盖前先 read）。
      用 bash（Windows 下为 powershell，并优先配合 glob / grep 检索文件与代码）执行 rg 搜索、构建、测试和 Git 检查；长命令可设 run_in_background: true，再用 job_output 续读、job_kill 停止。
      当任务涉及数据库连接查询或变更、SSH 远程操作、浏览器自动化、系统级桌面操控，或开发/转换 MyDSH 插件与自定义预设时，按需加载 mydsh-capabilities 或 mydsh-plugin-development Skill，并在 Shell 中通过受控命令行 `mydsh`（先运行 `mydsh --help` 或 `mydsh <domain> <action> --help` 核对参数）调用后台服务。
      保留用户已有改动，不自行 reset、clean、覆盖未读文件或扩大任务范围。遵循当前沙箱与审批策略，只对代码检查无法确定的需求选择或必要授权使用 ask_user_question 提问。
      工作中简短说明关键发现和下一步；最终清楚报告完成结果、验证证据与尚未验证的限制。
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
- id: coding-tools
  name: '@deepseek-ai/dsh-agent-presets/coding-tools'
  config:
    flavor: pi
    enableRunInBackground: true
    includePlan: true
- id: win32-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  disabled: !!js process.platform !== 'win32'
  config:
    sampleOverCapGlobResults: false
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: skill-filesystem
  name: '@mydsh/cli-bridge/preset-skills'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: command-goal
  name: '@deepseek-ai/dsh-command-goal'
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          当前处于计划模式。只读取、搜索和分析，不修改文件、配置或 Git 状态，也不运行会改写文件的检查。
          实现请求在此模式下表示规划实现。先查清实际代码，只对无法通过检查确定的需求或选择使用 ask_user_question 提问。
          计划写明目标、非目标、最小改动与验收标准。请勿使用 update_plan 记录本规划阶段；完成后调用 exit_plan_mode 提交完整 Markdown 计划，等待审批通过或用户切换模式后再实施。
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-chatgpt
      name: '@mydsh/compaction-chatgpt'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
- id: delegation
  name: cordis:group
  group: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        modelSelectionSettings: true
        backgroundMode: continuable
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000
- id: present
  name: '@deepseek-ai/dsh-tool-present'
