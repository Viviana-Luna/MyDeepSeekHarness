name: 功能建议
description: 提出新能力、交互优化或工作流改进想法
title: '[Feature] '
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与痛点
      description: 描述你在什么使用场景下遇到了不便，希望解决什么问题。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 说明你期望的交互方式、配置形态或行为表现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 补充说明或替代思路
      description: 如有参考产品、设计草图或相关约束可一并补充。
