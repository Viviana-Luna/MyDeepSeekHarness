name: 发布安装包

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: '先创建 Draft 草稿（推荐，确认产物与说明后再手动发布）'
        required: false
        default: true
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: 校验发布版本
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      draft: ${{ steps.check.outputs.draft }}
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 校验标签与 package.json 版本一致
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_DRAFT: ${{ inputs.draft }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node --input-type=module - <<'EOF'
          import { execFileSync } from 'node:child_process'
          import { appendFileSync, readFileSync } from 'node:fs'

          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          const version = String(pkg.version ?? '')
          const semverPattern =
            /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([\da-z-]+(?:\.[\da-z-]+)*))?$/u
          if (!semverPattern.test(version)) {
            console.error(`package.json 版本号格式无效：${version}`)
            process.exit(1)
          }

          const expectedTag = `v${version}`
          const eventName = process.env.EVENT_NAME
          const refName = process.env.REF_NAME
          const sha = process.env.GITHUB_SHA

          if (eventName === 'push') {
            if (refName !== expectedTag) {
              console.error(`推送标签（${refName}）与 package.json 版本（${expectedTag}）不一致。`)
              process.exit(1)
            }
          } else if (eventName === 'workflow_dispatch') {
            const lsRemote = execFileSync(
              'git',
              [
                'ls-remote',
                '--tags',
                'origin',
                `refs/tags/${expectedTag}`,
                `refs/tags/${expectedTag}^{}`,
              ],
              { encoding: 'utf8' },
            ).trim()
            if (lsRemote !== '') {
              const lines = lsRemote.split(/\r?\n/u)
              const peeled = lines.find(line => line.endsWith('^{}')) ?? lines[0]
              const taggedSha = peeled.split(/\s+/u)[0]
              if (taggedSha && taggedSha !== sha) {
                console.error(
                  `远端标签 ${expectedTag} 已指向提交 ${taggedSha}，与当前构建提交 ${sha} 不一致。`,
                )
                process.exit(1)
              }
            }
          }

          const prerelease = version.includes('-')
          const draft = eventName === 'workflow_dispatch' ? process.env.INPUT_DRAFT !== 'false' : true
          const outputFile = process.env.GITHUB_OUTPUT
          appendFileSync(outputFile, `version=${version}\n`)
          appendFileSync(outputFile, `tag=${expectedTag}\n`)
          appendFileSync(outputFile, `prerelease=${String(prerelease)}\n`)
          appendFileSync(outputFile, `draft=${String(draft)}\n`)
          console.log(
            `版本校验通过：tag=${expectedTag} prerelease=${String(prerelease)} draft=${String(draft)}`,
          )
          EOF

  build-macos:
    name: 构建并验收 macOS 安装包
    needs: validate
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建桌面应用与离线核心
        run: pnpm run build

      - name: 运行全量静态检查与单测
        run: pnpm run check

      - name: 验收离线核心
        run: pnpm run verify:core

      - name: 打包 macOS App
        run: node scripts/package-macos.mjs

      - name: 生成 macOS DMG 安装包
        run: node scripts/make-macos.mjs

      - name: 验收 macOS DMG 安装包
        run: pnpm run verify:package:made

      - name: 验收 macOS 打包运行态
        run: pnpm run verify:package:runtime

      - name: 核对 DMG 产物路径
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: test -f "out/make/mydsh-macOS-arm64-${VERSION}.dmg"

      - name: 上传 macOS 安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-macos-arm64
          path: out/make/mydsh-macOS-arm64-${{ needs.validate.outputs.version }}.dmg
          if-no-files-found: error
          retention-days: 7

  build-windows:
    name: 构建并验收 Windows 安装包
    needs: validate
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建桌面应用与离线核心
        run: pnpm run build

      - name: 运行全量静态检查与单测
        run: pnpm run check

      - name: 验收离线核心
        run: pnpm run verify:core

      - name: 验收源码桌面运行态
        run: node scripts/verify-source-runtime.mjs

      - name: 验收 Windows 窗口裁剪与缩放
        run: pnpm run verify:window

      - name: 打包 Windows 应用目录
        run: node scripts/package-windows.mjs

      - name: 生成 Windows 按用户安装程序
        run: node scripts/make-windows.mjs

      - name: 验收 Windows 安装包
        run: pnpm run verify:package:win -- --made

      - name: 核对 EXE 产物路径
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $exe = "out/mydsh-Windows-x64-$env:VERSION.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "未找到预期安装包：$exe"
          }

      - name: 上传 Windows 安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows-x64
          path: out/mydsh-Windows-x64-${{ needs.validate.outputs.version }}.exe
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: 汇总校验并生成 GitHub Release
    needs:
      - validate
      - build-macos
      - build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: 下载双端安装包产物
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true

      - name: 生成 SHA256 校验清单
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          MAC_DMG="mydsh-macOS-arm64-${VERSION}.dmg"
          WIN_EXE="mydsh-Windows-x64-${VERSION}.exe"
          cd release-assets
          test -f "$MAC_DMG"
          test -f "$WIN_EXE"
          LC_ALL=C sha256sum "$MAC_DMG" "$WIN_EXE" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 生成构建来源证明
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/mydsh-macOS-arm64-${{ needs.validate.outputs.version }}.dmg
            release-assets/mydsh-Windows-x64-${{ needs.validate.outputs.version }}.exe
            release-assets/SHA256SUMS.txt

      - name: 创建或刷新 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          VERSION: ${{ needs.validate.outputs.version }}
          TAG: ${{ needs.validate.outputs.tag }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          DRAFT: ${{ needs.validate.outputs.draft }}
        run: |
          set -euo pipefail
          MAC_DMG="mydsh-macOS-arm64-${VERSION}.dmg"
          WIN_EXE="mydsh-Windows-x64-${VERSION}.exe"

          EXISTING_STATUS="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" | node --input-type=module -e '
            import { readFileSync } from "node:fs"
            const releases = JSON.parse(readFileSync(0, "utf8")).flat()
            const found = releases.find(item => item.tag_name === process.env.TAG)
            if (!found) process.exit(0)
            console.log(`${found.draft ? "draft" : "published"}:${found.id}`)
          ')"

          if [[ "$EXISTING_STATUS" == published:* ]]; then
            echo "错误：Release ${TAG} 已公开发布，拒绝覆盖，请升级版本号后重试。" >&2
            exit 1
          fi

          if [[ "$EXISTING_STATUS" == draft:* ]]; then
            DRAFT_ID="${EXISTING_STATUS#draft:}"
            echo "发现同版本未发布草稿（ID: ${DRAFT_ID}），先清理旧草稿再重新生成。"
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${DRAFT_ID}"
          fi

          AUTO_NOTES="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body 2>/dev/null || true)"

          CHECKSUMS="$(cat release-assets/SHA256SUMS.txt)"

          cat > release-notes.md <<EOF
          ## 安装包清单

          | 平台 | 架构 | 安装包 |
          | --- | --- | --- |
          | macOS | Apple Silicon (\`arm64\`) | \`${MAC_DMG}\` |
          | Windows 11 | \`x64\` | \`${WIN_EXE}\` |

          > [!NOTE]
          > 当前构建默认使用 ad-hoc 签名，尚未接入商业代码签名或 Apple 公证。首次打开时 macOS Gatekeeper 或 Windows SmartScreen 可能出现安全提示，确认校验和无误后按系统提示放行即可。

          ## SHA-256 校验和

          \`\`\`text
          ${CHECKSUMS}
          \`\`\`
          EOF

          if [[ -n "$AUTO_NOTES" ]]; then
            {
              echo ""
              echo "## 变更记录"
              echo ""
              printf '%s\n' "$AUTO_NOTES"
            } >> release-notes.md
          fi

          CREATE_ARGS=(
            --target "$GITHUB_SHA"
            --title "MyDSH ${TAG}"
            --notes-file release-notes.md
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            CREATE_ARGS+=(--prerelease)
          fi
          if [[ "$DRAFT" == "true" ]]; then
            CREATE_ARGS+=(--draft)
          fi

          gh release create "$TAG" \
            "release-assets/${MAC_DMG}" \
            "release-assets/${WIN_EXE}" \
            "release-assets/SHA256SUMS.txt" \
            "${CREATE_ARGS[@]}"
